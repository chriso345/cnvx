name: CI / Build & Test
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch: {}
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref_name != 'master' && github.ref ||
    github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  find-crates:
    name: Discover Crates
    runs-on: ubuntu-latest
    outputs:
      crates: '${{ steps.list-crates.outputs.crates }}'
      filters: '${{ steps.list-crates.outputs.filters }}'
    steps:
      - uses: actions/checkout@v6
      - id: list-crates
        run: >
          crates=$(find crates -maxdepth 1 -mindepth 1 -type d -exec basename {}
          \; | jq -R -s -c 'split("\n")[:-1]')

          echo "crates=$crates" >> $GITHUB_OUTPUT

          filters=$(find crates -maxdepth 1 -mindepth 1 -type d -exec basename
          {} \; | while read -r crate; do
            echo "${crate}:"
            echo "  - 'crates/${crate}/**'"
            echo "  - 'Cargo.toml'"
            echo "  - 'Cargo.lock'"
          done)

          filters="${filters}

          integration:
            - 'crates/**'
            - 'tests/**'
            - 'Cargo.toml'
            - 'Cargo.lock'"
          echo "filters<<EOF" >> $GITHUB_OUTPUT

          echo "$filters" >> $GITHUB_OUTPUT

          echo "EOF" >> $GITHUB_OUTPUT

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    needs: find-crates
    outputs:
      crates: '${{ steps.build-outputs.outputs.crates }}'
      testing: '${{ steps.filter.outputs.integration }}'
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: none
          filters: '${{ needs.find-crates.outputs.filters }}'
      - id: build-outputs
        run: >
          crates=$(echo '${{ steps.filter.outputs.changes }}' | jq -c '[.[] |
          select(. != "integration")]')

          echo "crates=$crates" >> $GITHUB_OUTPUT

  required:
    name: Required Checks
    runs-on: ubuntu-latest
    if: always()
    needs:
      - build
      - netlib-test
      - examples
      - lint
      - test
    steps:
      - id: status
        name: Determine status
        if: always()
        run: |
          results=$(tr -d '\n' <<< '${{ toJSON(needs.*.result) }}')
          echo "Upstream results: $results"
          if echo "$results" | grep -qE '(failure|cancelled)'; then
            result="failed"
          else
            result="success"
          fi
          echo "result=$result" >> $GITHUB_OUTPUT
          echo "results=$results" >> $GITHUB_OUTPUT
      - if: steps.status.outputs.result != 'success'
        name: Fail if any upstream failed
        run: >
          echo "One or more upstream jobs failed: ${{
          steps.status.outputs.results }}"

          exit 1
  build:
    name: Build - Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install OpenBLAS and SuiteSparse
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapacke-dev libsuitesparse-dev
      - name: Build
        env:
          LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/openblas-pthread:/usr/lib/x86_64-linux-gnu/lapack
        run: cargo build --workspace --all-targets

  lint:
    name: 'Lint, Format and Docs - Workspace'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install OpenBLAS and SuiteSparse
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapacke-dev libsuitesparse-dev
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - name: Run Clippy
        run: ./scripts/lint.sh
      - name: Check Formatting
        run: ./scripts/fmt.sh
      - name: Check Docs
        run: ./scripts/docs.sh

  test:
    name: Test - Crate
    runs-on: ubuntu-latest
    needs:
      - changes
      - find-crates
    if: 'needs.changes.outputs.crates != ''[]'''
    strategy:
      matrix:
        crate: '${{ fromJSON(needs.changes.outputs.crates) }}'
    steps:
      - uses: actions/checkout@v6
      - name: Install OpenBLAS and SuiteSparse
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapacke-dev libsuitesparse-dev
      - name: 'Run ${{ matrix.crate }} tests'
        env:
          LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/openblas-pthread:/usr/lib/x86_64-linux-gnu/lapack
        run: 'cargo test -p ${{ matrix.crate }}'

  # TODO: Have a way to target specific examples to run (based on features) and
  # only run those examples when the corresponding features are changed.
  examples:
    name: Examples
    runs-on: ubuntu-latest
    needs:
      - changes
      - build
      - test
    if: |
      needs.changes.outputs.testing == 'true' &&
      needs.test.result != 'failure'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install OpenBLAS and SuiteSparse
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapacke-dev libsuitesparse-dev
      - name: Run examples
        env:
          LIBRARY_PATH: /usr/lib/x86_64-linux-gnu/openblas-pthread:/usr/lib/x86_64-linux-gnu/lapack
        run: ./scripts/run_examples.sh

  netlib-test:
    name: Netlib Tests
    runs-on: ubuntu-latest
    needs:
      - changes
      - build
      - test
    if: |
      needs.changes.outputs.testing == 'true' &&
      needs.test.result != 'failure'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install OpenBLAS and SuiteSparse
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev liblapacke-dev libsuitesparse-dev
      - name: Run netlib tests
        run: timeout 240s cargo netlib -- --nocapture
